[package]
name = "voxkit"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Local voice daemon for the fcitx5-mcbopomofo voice proof of concept"

[dependencies]
anyhow = "1"
cpal = "0.15"
libc = "0.2"
hex = "0.4"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# CPU only. The crate's default feature pulls in Metal, which does not build on Linux.
transcribe-cpp = { version = "0.4.1", default-features = false }
ureq = "2.12"
